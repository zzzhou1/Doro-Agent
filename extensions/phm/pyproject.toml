[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doro-phm"
version = "0.2.0"
description = "NASA C-MAPSS RUL models with inference and training-control MCP servers"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<2.3",
    "torch==2.5.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
phm = "phm_mcp.cli:main"
phm-mcp = "phm_mcp.server:main"
phm-admin = "phm_mcp.admin_cli:main"
phm-admin-mcp = "phm_mcp.admin_server:main"
phm-worker = "phm_mcp.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
