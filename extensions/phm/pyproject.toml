[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-claude-phm"
version = "0.1.0"
description = "NASA C-MAPSS RUL models and a read-only MCP server for Mini Claude Code"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<2.3",
    "torch==2.5.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
phm = "phm_mcp.cli:main"
phm-mcp = "phm_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
