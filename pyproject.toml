[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doro-agent"
version = "1.0.0"
description = "Doro: an extensible local agent for coding and industrial PHM workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "anthropic>=0.40.0,<1.0.0",
    "openai>=1.50.0,<3.0.0",
    "prompt-toolkit>=3.0.0,<4.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "rich>=13.0.0,<15.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[project.scripts]
doro = "doro.__main__:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.24.0,<2.0.0",
]
lint = [
    "ruff>=0.16.0,<1.0.0",
    "mypy>=1.11.0,<3.0.0",
]

[tool.setuptools.packages.find]
include = ["doro*"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Deliberately narrow. These catch defects the test suite cannot see: unused
# imports, undefined names, deprecated syntax, import order. Style-only rule
# families are left off on purpose — switching them on now would mean a
# tree-wide rewrite riding along with unrelated changes.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]
ignore = [
    # Flag "ambiguous" unicode in strings and comments (full-width punctuation,
    # CJK). The comments and CLI strings in this codebase are bilingual on
    # purpose, so these fire on prose rather than on defects.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.11"
# Developed and shipped on Windows. Pinning the platform keeps the Windows-only
# branches (taskkill, creationflags) checked *and* keeps the POSIX-only ignore
# in mcp_client.py from becoming an "unused ignore" error on Linux CI.
platform = "win32"
files = ["doro"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
